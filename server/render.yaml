services:
  - type: web
    name: soapso-server
    env: python
    rootDir: server/
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn project.wsgi:application
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,soapso.netlify.app,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://soapso.netlify.app,http://localhost:3000