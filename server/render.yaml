services:
  - type: web
    name: soapso-server
    env: python
    region: frankfurt
    rootDir: server/
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn project.wsgi:application
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://soapso.netlify.app
      - key: PYTHON_VERSION
        value: 3.12.0