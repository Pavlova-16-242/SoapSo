services:
  - type: web
    name: soapso-server
    env: python
    region: frankfurt
    rootDir: server/
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --noinput
    startCommand: gunicorn project.wsgi:application
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://soapso.netlify.app,http://localhost:3000
      - key: PYTHONPATH
        value: /opt/render/project/src/server